<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة المرور | بوابة التمريض</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <a class="back-home" href="index.html">← العودة للرئيسية</a>

  <main class="auth-layout">
    <section class="auth-brand-panel">
      <img src="assets/images/logo.png" alt="شعار بوابة التمريض">
      <h1>ولا يهمك!</h1>
      <p>هنساعدك ترجع لحسابك وتكمل مذاكرتك.</p>
    </section>

    <section class="auth-card">
      <span class="eyebrow">استعادة الحساب</span>
      <h2>نسيت كلمة المرور؟</h2>
      <p class="muted">
        اكتب بريدك الإلكتروني، وسنرسل لك رابط إعادة تعيين كلمة المرور.
      </p>

      <form id="resetForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" required>

        <button class="btn btn-primary btn-block" type="submit">
          إرسال رابط الاستعادة
        </button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        <a href="login.html">العودة لتسجيل الدخول</a>
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };

    document.getElementById("resetForm").addEventListener(
      "submit", async (event) => {
        event.preventDefault();

        const message = document.getElementById("formMessage");
        const email = document.getElementById("email").value.trim();

        if (firebaseConfig.apiKey === "YOUR_API_KEY") {
          message.textContent = "أضف إعدادات Firebase لتفعيل الاستعادة.";
          message.className = "form-message error";
          return;
        }

        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          await sendPasswordResetEmail(auth, email);

          message.textContent = "لو البريد مسجل، هيوصلك رابط إعادة التعيين.";
          message.className = "form-message success";
        } catch {
          message.textContent = "تعذر إرسال الرابط. راجع البريد وحاول مجددًا.";
          message.className = "form-message error";
        }
      }
    );
  </script>
</body>
</html>
