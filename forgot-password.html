<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>استعادة كلمة المرور | بوابة التمريض</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <main class="page-center">
    <div class="auth-wrapper">

      <header class="auth-brand">
        <img src="assets/images/logo.png" alt="شعار بوابة التمريض"
             onerror="this.style.display='none'">
        <h1>بوابة التمريض</h1>
        <p>استعادة الوصول إلى حسابك</p>
      </header>

      <section class="auth-card">
        <h2 class="auth-heading">نسيت كلمة المرور؟</h2>
        <p class="auth-description">
          اكتب البريد الإلكتروني المرتبط بحسابك، وسنرسل لك رابط إعادة تعيين كلمة المرور.
        </p>

        <div id="message" class="message" role="status"></div>

        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input
              id="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >
          </div>

          <button id="resetButton" class="btn btn-primary btn-block auth-submit"
                  type="submit">
            إرسال رابط الاستعادة
          </button>
        </form>

        <div class="auth-divider"></div>

        <p class="auth-footer">
          افتكرت كلمة المرور؟
          <a href="login.html">تسجيل الدخول</a>
        </p>
      </section>

      <a class="auth-home-link" href="index.html">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>
  </main>

  <script type="module">
    import { auth } from "./js/config.js";

    import {
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      button.disabled = true;
      button.textContent = "جاري الإرسال...";

      try {
        await sendPasswordResetEmail(auth, email);

        showMessage(
          "لو البريد مرتبط بحساب، هيوصلك رابط استعادة كلمة المرور. راجع صندوق الوارد والرسائل غير المرغوب فيها.",
          "success"
        );
      } catch (error) {
        if (error.code === "auth/invalid-email") {
          showMessage("البريد الإلكتروني غير صحيح.");
        } else if (error.code === "auth/too-many-requests") {
          showMessage("محاولات كثيرة. حاول مرة أخرى بعد قليل.");
        } else if (error.code === "auth/network-request-failed") {
          showMessage("تأكد من اتصالك بالإنترنت.");
        } else {
          showMessage("تعذر إرسال الرابط حاليًا. حاول مرة أخرى.");
        }
      } finally {
        button.disabled = false;
        button.textContent = "إرسال رابط الاستعادة";
      }
    });
  </script>
</body>
</html>
