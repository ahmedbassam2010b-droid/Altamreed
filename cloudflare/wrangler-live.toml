name = "bawabet-live-storage-api"
main = "live-storage-api.js"
compatibility_date = "2026-11-28"
workers_dev = false
routes = [{ pattern = "api.bawabet-altamreed.com/*", zone_name = "bawabet-altamreed.com" }]

[[r2_buckets]]
binding = "FILES"
bucket_name = "bawabet-academy-files"

[vars]
FIREBASE_PROJECT_ID = "bawabet-altamreed"
LIVEKIT_WS_URL = "wss://live.bawabet-altamreed.com"
LIVEKIT_API_URL = "https://live.bawabet-altamreed.com"
# Set FIREBASE_API_KEY as a Worker variable. Set LIVEKIT_API_KEY and LIVEKIT_API_SECRET as Worker secrets.
# Keep DOWNLOAD_SIGNING_SECRET as a Worker secret for R2 download tickets.
