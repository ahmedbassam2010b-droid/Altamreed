<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | بوابة التمريض</title>
  <meta name="description" content="أنشئ حسابك في بوابة التمريض التعليمية.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <main class="page-center">
    <div class="auth-wrapper">

      <header class="auth-brand">
        <img src="assets/images/logo.png" alt="شعار بوابة التمريض"
             onerror="this.style.display='none'">
        <h1>بوابة التمريض</h1>
        <p>حسابك الدراسي في مكان واحد</p>
      </header>

      <section class="auth-card">
        <h2 class="auth-heading">إنشاء حساب جديد</h2>
        <p class="auth-description">
          اكتب بياناتك علشان تبدأ رحلتك التعليمية.
        </p>

        <div id="message" class="message" role="alert"></div>

        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="fullName">الاسم بالكامل</label>
            <input
              id="fullName"
              name="fullName"
              type="text"
              placeholder="اكتب اسمك"
              autocomplete="name"
              minlength="3"
              required
            >
          </div>

          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="6 أحرف على الأقل"
              autocomplete="new-password"
              minlength="6"
              required
            >
            <p class="password-note">كلمة المرور يجب أن تكون 6 أحرف على الأقل.</p>
          </div>

          <div class="form-group">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="اكتب كلمة المرور مرة أخرى"
              autocomplete="new-password"
              minlength="6"
              required
            >
          </div>

          <button id="registerButton" class="btn btn-primary btn-block auth-submit"
                  type="submit">
            إنشاء الحساب
          </button>
        </form>

        <div class="auth-divider"></div>

        <p class="auth-footer">
          عندك حساب بالفعل؟
          <a href="login.html">تسجيل الدخول</a>
        </p>
      </section>

      <a class="auth-home-link" href="index.html">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>
  </main>

  <script type="module">
    import { auth } from "./js/config.js";

    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const form = document.getElementById("registerForm");
    const fullNameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function translateError(code) {
      const errors = {
        "auth/email-already-in-use": "البريد الإلكتروني مسجل بالفعل.",
        "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
        "auth/weak-password": "كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.",
        "auth/operation-not-allowed": "تسجيل الحسابات بالبريد الإلكتروني غير مُفعّل في Firebase.",
        "auth/network-request-failed": "تأكد من اتصالك بالإنترنت."
      };

      return errors[code] || "حدث خطأ أثناء إنشاء الحساب. حاول مرة أخرى.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";

      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (fullName.length < 3) {
        showMessage("اكتب اسمك بالكامل.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.");
        return;
      }

      button.disabled = true;
      button.textContent = "جاري إنشاء الحساب...";

      try {
        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(credential.user, {
          displayName: fullName
        });

        showMessage("تم إنشاء الحساب بنجاح. جاري تحويلك...", "success");

        window.location.replace("dashboard.html");
      } catch (error) {
        showMessage(translateError(error.code));
      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>
</body>
</html>
