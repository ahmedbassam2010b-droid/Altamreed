<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | بوابة التمريض</title>
  <meta
    name="description"
    content="سجّل دخولك إلى بوابة التمريض لمتابعة دروسك ومراجعاتك."
  >

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    :root {
      --login-bg: #081421;
      --login-card: #101f30;
      --login-border: #24374a;
      --login-text: #f3f7fb;
      --login-muted: #9aabba;
      --login-primary: #20c6b3;
      --login-primary-dark: #0fa895;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", "Tahoma", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #123344 0, transparent 35%),
        radial-gradient(circle at 90% 85%, #103b3c 0, transparent 30%),
        var(--login-bg);
      color: var(--login-text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .brand h1 {
      font-size: 27px;
      margin: 0 0 8px;
      font-weight: 800;
    }

    .brand p {
      color: var(--login-muted);
      margin: 0;
      font-size: 14px;
    }

    .login-card {
      background: rgba(16, 31, 48, 0.96);
      border: 1px solid var(--login-border);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .login-card h2 {
      font-size: 23px;
      margin: 0 0 8px;
    }

    .login-subtitle {
      color: var(--login-muted);
      font-size: 14px;
      margin: 0 0 25px;
      line-height: 1.8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid var(--login-border);
      background: #0a1725;
      color: var(--login-text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--login-primary);
      box-shadow: 0 0 0 3px rgba(32, 198, 179, 0.12);
    }

    .form-group input::placeholder {
      color: #718294;
    }

    .forgot-password {
      display: block;
      color: var(--login-primary);
      text-decoration: none;
      font-size: 13px;
      margin: -5px 0 20px;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      background: var(--login-primary);
      color: #06201e;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: var(--login-primary-dark);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 17px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
    }

    .message.error {
      display: block;
      color: #ffc5c5;
      background: rgba(220, 70, 70, 0.12);
      border: 1px solid rgba(220, 70, 70, 0.3);
    }

    .message.success {
      display: block;
      color: #b8ffea;
      background: rgba(32, 198, 179, 0.12);
      border: 1px solid rgba(32, 198, 179, 0.3);
    }

    .register-link {
      text-align: center;
      color: var(--login-muted);
      font-size: 14px;
      margin: 22px 0 0;
    }

    .register-link a {
      color: var(--login-primary);
      text-decoration: none;
      font-weight: 700;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      display: block;
      text-align: center;
      color: var(--login-muted);
      text-decoration: none;
      font-size: 13px;
      margin-top: 22px;
    }

    .back-home:hover {
      color: var(--login-text);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 23px 20px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-wrapper">

    <header class="brand">
      <img
        src="assets/images/logo.png"
        alt="شعار بوابة التمريض"
        class="brand-logo"
        onerror="this.style.display='none'"
      >

      <h1>بوابة التمريض</h1>
      <p>رحلتك التعليمية تبدأ من هنا</p>
    </header>

    <section class="login-card">
      <h2>أهلاً بعودتك 👋</h2>
      <p class="login-subtitle">
        سجّل دخولك لمتابعة دروسك ومراجعاتك التعليمية.
      </p>

      <div id="message" class="message" role="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="اكتب كلمة المرور"
            autocomplete="current-password"
            required
          >
        </div>

        <a href="forgot-password.html" class="forgot-password">
          نسيت كلمة المرور؟
        </a>

        <button type="submit" id="loginButton" class="login-button">
          تسجيل الدخول
        </button>
      </form>

      <p class="register-link">
        ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </p>
    </section>

    <a href="index.html" class="back-home">
      ← العودة إلى الصفحة الرئيسية
    </a>

  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
