
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | بوابة التمريض</title>

  <meta
    name="description"
    content="سجل دخولك إلى بوابة التمريض لمتابعة دروسك ومراجعاتك."
  >

  <!-- ملفات التصميم المشتركة -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

  <main class="page-center">

    <div class="auth-wrapper">

      <!-- الهوية البصرية -->
      <header class="auth-brand">

        <img
          src="assets/images/logo.png"
          alt="شعار بوابة التمريض"
          onerror="this.style.display='none'"
        >

        <h1>بوابة التمريض</h1>

        <p>رحلتك التعليمية تبدأ من هنا</p>

      </header>


      <!-- بطاقة تسجيل الدخول -->
      <section class="auth-card">

        <h2 class="auth-heading">
          أهلاً بعودتك 👋
        </h2>

        <p class="auth-description">
          سجل دخولك لمتابعة دروسك ومراجعاتك التعليمية.
        </p>


        <!-- رسائل النظام -->
        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="auth-form">

          <div class="form-group">

            <label for="email">
              البريد الإلكتروني
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              كلمة المرور
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="اكتب كلمة المرور"
              autocomplete="current-password"
              required
            >

          </div>


          <div class="auth-action-link">

            <a
              href="forgot-password.html"
              class="text-link"
            >
              نسيت كلمة المرور؟
            </a>

          </div>


          <button
            type="submit"
            id="loginButton"
            class="btn btn-primary btn-block auth-submit"
          >
            تسجيل الدخول
          </button>

        </form>


        <div class="auth-divider"></div>


        <p class="auth-footer">
          ليس لديك حساب؟
          <a href="register.html">
            إنشاء حساب جديد
          </a>
        </p>

      </section>


      <!-- العودة للرئيسية -->
      <a href="index.html" class="auth-home-link">
        ← العودة إلى الصفحة الرئيسية
      </a>

    </div>

  </main>


  <!-- Firebase Authentication -->
  <script type="module" src="js/auth.js"></script>

</body>
</html>
