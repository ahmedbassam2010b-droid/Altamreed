<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | بوابة التمريض</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <a class="back-home" href="index.html">← العودة للرئيسية</a>

  <main class="auth-layout">
    <section class="auth-brand-panel">
      <img src="assets/images/logo.png" alt="شعار بوابة التمريض">
      <h1>أهلًا بعودتك!</h1>
      <p>كمّل رحلتك التعليمية وارجع لمذاكرتك من حيث توقفت.</p>
    </section>

    <section class="auth-card">
      <span class="eyebrow">حساب الطالب</span>
      <h2>تسجيل الدخول</h2>
      <p class="muted">أدخل بيانات حسابك للمتابعة.</p>

      <form id="loginForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email"
               placeholder="name@example.com" autocomplete="email" required>

        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password"
               placeholder="أدخل كلمة المرور" autocomplete="current-password" required>

        <div class="form-between">
          <label class="check-label">
            <input type="checkbox" id="remember">
            تذكرني
          </label>
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button class="btn btn-primary btn-block" type="submit">
          تسجيل الدخول
        </button>

        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <p class="auth-switch">
        ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا جديدًا</a>
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // ضع إعدادات Firebase الخاصة بمشروعك هنا.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_APP_ID"
    };

    const form = document.getElementById("loginForm");
    const message = document.getElementById("formMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (firebaseConfig.apiKey === "YOUR_API_KEY") {
        message.textContent =
          "أضف إعدادات Firebase أولًا لتفعيل تسجيل الدخول الحقيقي.";
        message.className = "form-message error";
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        message.textContent = "تعذر تسجيل الدخول. راجع البريد وكلمة المرور.";
        message.className = "form-message error";
      }
    });
  </script>
</body>
</html>
