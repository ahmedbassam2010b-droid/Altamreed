
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | بوابة التمريض</title>

  <meta
    name="description"
    content="سجل دخولك إلى بوابة التمريض لمتابعة دروسك ومراجعاتك."
  >

  <!-- ملفات التصميم المشتركة -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

  <main class="page-center">

    <div class="auth-wrapper">

      <!-- الهوية البصرية -->
      <header class="auth-brand">

        <img
          src="assets/images/logo.png"
          alt="شعار بوابة التمريض"
          onerror="this.style.display='none'"
        >

        <h1>بوابة التمريض</h1>

        <p>رحلتك التعليمية تبدأ من هنا</p>

      </header>


      <!-- بطاقة تسجيل الدخول -->
      <section class="auth-card">

        <h2 class="auth-heading">
          أهلاً بعودتك 👋
        </h2>

        <p class="auth-description">
          سجل دخولك لمتابعة دروسك ومراجعاتك التعليمية.
        </p>


        <!-- رسائل النظام -->
        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="auth-form">

          <div class="form-group">

            <label for="email">
              البريد الإلكتروني
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="password">
              كلمة المرور
            </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="اكتب كلمة المرور"
              autocomplete="current-password"
              required
            >

          </div>


          <div class="auth-action-link">

            <a
              href="forgot-password.html"
              class="text-link"
            >
              نسيت كلمة المرور؟
            </a>

          </div>


          <button
            type="submit"
            id="loginButton"
            class="btn btn-primary btn-block auth-submit"
          >
            تسجيل الدخول
          </button>

        </form>


        <div class="auth-divider"><span>أو</span></div>
        <button id="googleLoginButton" class="btn btn-google btn-block" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.66 5.94c4.47-4.13 7.11-10.2 7.11-17.59Z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.86l-7.66-5.94c-2.13 1.43-4.86 2.28-8.24 2.28-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>
          المتابعة باستخدام Google
        </button>


        <p class="auth-footer">
          ليس لديك حساب؟
          <a href="register.html">
            إنشاء حساب جديد
          </a>
        </p>

      </section>


      <!-- العودة للرئيسية -->
      <a href="index.html" class="auth-home-link">
        ← العودة إلى الصفحة الرئيسية
      </a>

    </div>

  </main>


  <!-- Firebase Authentication -->
  <script type="module" src="js/auth.js"></script>

</body>
</html>
