<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>دخول المدرسين | بوابة التمريض</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/teachers.css"></head>
<body class="teachers-app t-auth-bg"><main class="t-auth"><a class="t-back" href="/">← بوابة التمريض</a><div class="t-brand-mark">BT</div><span class="t-kicker">BAWABET TEACHERS</span><h1>مساحة المدرسين</h1><p class="t-muted">سجّل الدخول إلى أكاديميتك باستخدام كود المدرس.</p><div id="teacherLoginNotice" class="t-notice" role="status"></div><form id="teacherLoginForm" class="t-form"><label>كود المدرس<input id="teacherCode" required autocomplete="username" autocapitalize="characters" placeholder="اكتب كود الدخول"></label><label>كلمة المرور<input id="teacherPassword" type="password" required autocomplete="current-password" placeholder="كلمة المرور"></label><button class="t-btn t-btn-primary" type="submit">تسجيل الدخول</button></form><p class="t-hint">إذا انتهى اشتراكك أو تم إيقاف الحساب، تواصل مع إدارة بوابة التمريض.</p></main><script type="module" src="js/teacher-login.js"></script></body></html>
