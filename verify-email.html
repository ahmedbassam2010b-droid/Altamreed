<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>تأكيد البريد الإلكتروني | بوابة التمريض</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css">
</head><body class="auth-page"><main class="page-center"><div class="auth-wrapper">
<header class="auth-brand"><img src="assets/images/logo.png" alt="شعار بوابة التمريض" onerror="this.style.display='none'"><h1>بوابة التمريض</h1><p>خطوة أخيرة لتفعيل حسابك ✉️</p></header>
<section class="auth-card"><h2 class="auth-heading">تأكيد البريد الإلكتروني</h2>
<p class="auth-description">أرسلنا رسالة تأكيد إلى بريدك الإلكتروني. افتح الرسالة واضغط على رابط التأكيد، ثم ارجع واضغط على زر التحقق بالأسفل.</p>
<div id="verificationEmail" class="message success" aria-live="polite">بانتظار تأكيد بريدك الإلكتروني...</div>
<div id="message" class="message" role="alert" aria-live="polite"></div>
<button id="checkVerificationButton" class="btn btn-primary btn-block" type="button">تم تأكيد البريد — تحقق الآن</button>
<button id="resendVerificationButton" class="btn btn-secondary btn-block" type="button">إعادة إرسال رسالة التأكيد</button>
<p class="auth-footer">لو استخدمت بريدًا غير صحيح، يمكنك <a href="login">العودة لتسجيل الدخول</a>.</p>
</section></div></main><script type="module" src="js/verify-email.js"></script><script src="js/site-footer.js"></script></body></html>
