<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>قاعة المحاضرة المباشرة | بوابة التمريض</title>
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/teachers.css">
<style>
.live-room-shell{width:min(1500px,100%);margin:auto;padding:14px}.live-room-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;margin-bottom:12px;border-radius:17px;background:linear-gradient(120deg,#103b5c,#176b91 68%,#159aa8);color:#fff}.live-room-head h1{font-size:clamp(18px,3vw,25px);margin:0 0 5px}.live-room-head p{margin:0;color:#d9edf5;font-size:13px}.live-room-head [data-state=error]{color:#ffe0e0}.live-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}.live-main{min-width:0}.live-video-stage{min-height:430px;background:#101b2a;border-radius:16px;padding:10px}.live-video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.live-video-tile{position:relative;min-height:210px;background:#1e2c3b;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.live-video-media{width:100%;height:100%;min-height:210px;display:flex;align-items:center;justify-content:center}.live-video-media video{width:100%;height:100%;max-height:55vh;object-fit:contain}.live-video-name{position:absolute;bottom:8px;right:8px;z-index:2;background:#0b1724d9;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px}.live-controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}.live-control,.live-small-btn{border:0;border-radius:10px;padding:10px 14px;background:#e9f2f8;color:#174563;font-weight:700;cursor:pointer}.live-control.is-active{background:#d9f3e8;color:#126344}.live-control:disabled{opacity:.5}.live-control.danger{background:#ffe5e5;color:#a32121}.live-sidebar{display:flex;flex-direction:column;gap:12px}.live-panel{background:#fff;border:1px solid #dce7ef;border-radius:14px;padding:12px;min-width:0}.live-panel h2{font-size:15px;margin:0 0 10px;color:#174563}.live-chat-messages{height:230px;overflow:auto;display:flex;flex-direction:column;gap:7px}.live-chat-item{display:flex;flex-direction:column;gap:2px;background:#f2f7fa;padding:8px;border-radius:9px;font-size:13px}.live-chat-item strong{color:#176b91}.live-chat-item.is-system{background:#edf7f2;color:#23634c}.live-chat-form{display:flex;gap:6px;margin-top:8px}.live-chat-form input{min-width:0;flex:1;border:1px solid #d7e2ea;border-radius:8px;padding:9px}.live-chat-form button{border:0;border-radius:8px;background:#176b91;color:white;padding:8px 12px}.live-hand-request{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #edf1f4;font-size:12px}.live-hand-request span{flex:1}.live-small-btn{padding:7px 9px;font-size:11px}.live-allow{background:#dff5e9;color:#14633f}.live-empty{color:#8293a0;font-size:12px}.live-count{font-size:12px;color:#d9edf5}.live-count strong{font-size:16px;color:#fff}.live-footer{display:flex;justify-content:space-between;align-items:center;gap:10px}.live-hidden{display:none!important}
@media(max-width:850px){.live-layout{grid-template-columns:1fr}.live-sidebar{display:grid;grid-template-columns:1fr 1fr}.live-video-stage{min-height:320px}}
@media(max-width:560px){.live-room-shell{padding:7px}.live-room-head{padding:12px;align-items:flex-start;flex-direction:column}.live-sidebar{grid-template-columns:1fr}.live-video-grid{grid-template-columns:1fr 1fr}.live-video-tile,.live-video-media{min-height:150px}.live-video-media video{max-height:35vh}.live-stage{min-height:300px}.live-control{padding:9px 10px;font-size:12px}}
</style>
</head>
<body class="teachers-app">
<main class="live-room-shell">
<header class="live-room-head">
 <div><span class="t-kicker">BAWABET ALTAMREED · LIVE CLASSROOM</span><h1 id="liveTitle">قاعة المحاضرة المباشرة</h1><p id="liveNotice">جارٍ التحقق من صلاحية الدخول وتجهيز الفصل...</p></div>
 <div class="live-footer"><span class="live-count">الموجودون: <strong id="liveParticipantCount">—</strong></span><a id="backLink" href="student-academy.html" class="t-btn t-btn-light">العودة</a></div>
</header>
<div class="live-layout">
 <section class="live-main">
  <div class="live-video-stage"><div id="liveVideoGrid" class="live-video-grid"></div></div>
  <div class="live-controls" id="liveMediaControls">
   <button id="liveMic" class="live-control">🎙️ الميكروفون</button>
   <button id="liveCamera" class="live-control">📷 الكاميرا</button>
   <button id="liveScreen" class="live-control">🖥️ مشاركة الشاشة</button>
   <button id="liveRaiseHand" class="live-control">✋ رفع اليد</button>
   <button id="liveLeave" class="live-control danger">مغادرة المحاضرة</button>
  </div>
 </section>
 <aside class="live-sidebar">
  <section class="live-panel" id="liveTeacherTools" hidden><h2>طلبات المشاركة</h2><div id="liveHandsList"><p class="live-empty">لا توجد طلبات مشاركة حاليًا.</p></div></section>
  <section class="live-panel"><h2>المحادثة والأسئلة</h2><div id="liveChatMessages" class="live-chat-messages"></div><form id="liveChatForm" class="live-chat-form"><input id="liveChatInput" maxlength="500" placeholder="اكتب سؤالك أو رسالتك..." autocomplete="off"><button type="submit">إرسال</button></form></section>
 </aside>
</div>
</main>
<script type="module" src="js/live-room.js"></script>
</body></html>
