<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#123b5a">
<title>تأكيد الحساب واستعادة كلمة المرور | بوابة التمريض</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="page-center"><div class="auth-wrapper">
<header class="auth-brand"><img src="assets/images/logo.png" alt="شعار بوابة التمريض" onerror="this.style.display='none'"><h1>بوابة التمريض</h1><p>تعليم تمريضي بخطوات أوضح 🩺</p></header>
<section class="auth-card">
<div class="email-action-mark" aria-hidden="true">✉️</div>
<h2 class="auth-heading" id="actionTitle">جارٍ التحقق من الرابط...</h2>
<p class="auth-description" id="actionDescription">يرجى الانتظار قليلًا حتى نتحقق من صلاحية الرابط.</p>
<div id="actionMessage" class="message info" role="status" aria-live="polite">جارٍ تجهيز طلبك...</div>
<button id="confirmEmailButton" class="btn btn-primary btn-block auth-submit" type="button" hidden>تأكيد البريد الإلكتروني</button>
<form id="passwordResetForm" class="auth-form" hidden>
<div class="form-group"><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="6 أحرف على الأقل"></div>
<div class="form-group"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="أعد كتابة كلمة المرور"></div>
<button id="savePasswordButton" class="btn btn-primary btn-block auth-submit" type="submit">حفظ كلمة المرور الجديدة</button>
</form>
<a id="loginActionButton" class="btn btn-primary btn-block auth-submit" href="login" hidden>الانتقال إلى تسجيل الدخول</a>
<a class="auth-home-link" href="">العودة إلى بوابة التمريض</a>
</section></div></main>
<script type="module" src="js/email-action.js"></script><script src="js/site-footer.js"></script>
</body></html>
