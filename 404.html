
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>أوبا! الصفحة مش هنا</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Cairo", "Tahoma", sans-serif;
            background: #f4f9ff;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: #ffffff;
            padding: 45px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 40px
                        rgba(30, 100, 180, 0.08);
        }

        .illustration {
            font-size: 85px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(25px, 5vw, 36px);
            color: #1677c8;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            background: #1677c8;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-button:hover {
            background: #105fa3;
            transform: translateY(-3px);
        }

        .secondary-link {
            display: block;
            margin-top: 20px;
            color: #1677c8;
            text-decoration: none;
            font-size: 14px;
        }

        .secondary-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 35px 20px;
            }

            .illustration {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="illustration">
            🩺
        </div>

        <h1>أوبا! الصفحة مش هنا 👀</h1>

        <p>
            يبدو إن الصفحة اللي بتدور عليها مش موجودة
            أو اتنقلت لمكان تاني.
            <br>
            متقلقش، نقدر نرجعك للمكان الصح!
        </p>

        <a href="/" class="home-button">
            العودة للصفحة الرئيسية ←
        </a>

        <a href="/courses" class="secondary-link">
            أو استكشف المحتوى التعليمي من جديد
        </a>

    </main>

</body>
</html>
