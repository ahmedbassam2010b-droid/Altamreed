text><text x="82" y="390" font-size="22" fill="#18324c">The book describes AIDS as a viral disease</text><text x="82" y="424" font-size="22" fill="#18324c">associated with loss of immune function and</text><text x="82" y="458" font-size="22" fill="#18324c">lists transmission through sexual contact or</text><text x="82" y="492" font-size="22" fill="#18324c">blood. Features include weight loss, chronic</text><text x="82" y="526" font-size="22" fill="#18324c">diarrhea, pneumonia, generalized lymph-node</text><rect x="54" y="650" width="1086" height="56" rx="22" fill="#0b2348"/><text x="600" y="686" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">بوابة التمريض | Bawabet Al Tamreed • DERMATOLOGY</text></svg>