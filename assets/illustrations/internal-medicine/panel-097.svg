<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#e6f0fa"/></linearGradient><linearGradient id="navy" x2="0" y2="1"><stop stop-color="#24578e"/><stop offset="1" stop-color="#09264d"/></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff5b62"/><stop offset="1" stop-color="#b61e35"/></linearGradient></defs><rect width="1200" height="760" fill="url(#bg)"/><rect x="22" y="20" width="1156" height="720" rx="34" fill="#fff" stroke="#c9dceb" stroke-width="4"/><rect x="44" y="38" width="1112" height="82" rx="30" fill="url(#navy)"/><text x="600" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#9be8ea">ENDOCRINE • BAWABET AL TAMREED</text><text x="600" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Hypothalamus and Endocrine Glands</text><rect x="54" y="145" width="690" height="70" rx="25" fill="url(#red)"/><text x="399" y="190" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Endocrine control</text><rect x="770" y="145" width="370" height="480" rx="30" fill="#f7fbff" stroke="#bcd5e8" stroke-width="4"/><circle cx="955" cy="370" r="205" fill="#e7f2fa"/><path d="M740 190 C620 180 620 330 665 430 C710 520 810 480 825 390 C840 300 820 205 740 190Z M900 190 C1020 180 1020 330 975 430 C930 520 830 480 815 390 C800 300 820 205 900 190Z" fill="#bb6677" stroke="#85364e" stroke-width="12"/><rect x="54" y="238" width="690" height="387" rx="28" fill="#fff" stroke="#c7dceb" stroke-width="4"/><rect x="54" y="238" width="690" height="72" rx="26" fill="#eaf3fb"/><text x="88" y="282" font-size="22" font-weight="800" fill="#b82a3c">KEY CONCEPT • 097</text><text x="82" y="263" font-size="22" font-weight="700" fill="#18324c">Hypothalamus and Endocrine Glands |</text><text x="82" y="294" font-size="22" font-weight="700" fill="#18324c">تحت المهاد والغدد الصماء</text><text x="82" y="390" font-size="22" fill="#18324c">The textbook explains that the hypothalamus</text><text x="82" y="424" font-size="22" fill="#18324c">controls many endocrine glands through hormones</text><text x="82" y="458" font-size="22" fill="#18324c">reaching the pituitary gland along the</text><text x="82" y="492" font-size="22" fill="#18324c">hypothalamic–pituitary axis. The pituitary then</text><text x="82" y="526" font-size="22" fill="#18324c">stimulates the thyroid, adrenal glands an</text><rect x="54" y="650" width="1086" height="56" rx="22" fill="#0b2348"/><text x="600" y="686" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">بوابة التمريض | Bawabet Al Tamreed • ENDOCRINE</text></svg>