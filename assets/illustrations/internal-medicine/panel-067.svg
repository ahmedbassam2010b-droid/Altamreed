<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#e6f0fa"/></linearGradient><linearGradient id="navy" x2="0" y2="1"><stop stop-color="#24578e"/><stop offset="1" stop-color="#09264d"/></linearGradient><linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff5b62"/><stop offset="1" stop-color="#b61e35"/></linearGradient></defs><rect width="1200" height="760" fill="url(#bg)"/><rect x="22" y="20" width="1156" height="720" rx="34" fill="#fff" stroke="#c9dceb" stroke-width="4"/><rect x="44" y="38" width="1112" height="82" rx="30" fill="url(#navy)"/><text x="600" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#9be8ea">IMMUNOLOGY • BAWABET AL TAMREED</text><text x="600" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Schistosomiasis (Bilharziasis)</text><rect x="54" y="145" width="690" height="70" rx="25" fill="url(#red)"/><text x="399" y="190" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Transmission and life cycle overview</text><rect x="770" y="145" width="370" height="480" rx="30" fill="#f7fbff" stroke="#bcd5e8" stroke-width="4"/><circle cx="955" cy="370" r="205" fill="#e7f2fa"/><path d="M650 320 C710 220 900 210 990 300 C1010 380 925 455 820 450 C740 450 650 420 630 370Z" fill="#a84b4c" stroke="#78323b" stroke-width="12"/><rect x="54" y="238" width="690" height="387" rx="28" fill="#fff" stroke="#c7dceb" stroke-width="4"/><rect x="54" y="238" width="690" height="72" rx="26" fill="#eaf3fb"/><text x="88" y="282" font-size="22" font-weight="800" fill="#b82a3c">KEY CONCEPT • 067</text><text x="82" y="263" font-size="22" font-weight="700" fill="#18324c">Schistosomiasis (Bilharziasis) |</text><text x="82" y="294" font-size="22" font-weight="700" fill="#18324c">البلهارسيا</text><text x="82" y="390" font-size="22" fill="#18324c">The textbook explains that human infection</text><text x="82" y="424" font-size="22" fill="#18324c">follows contact with fresh water containing the</text><text x="82" y="458" font-size="22" fill="#18324c">cercaria stage. The cercaria penetrates the</text><text x="82" y="492" font-size="22" fill="#18324c">skin and migrates to blood vessels around the</text><text x="82" y="526" font-size="22" fill="#18324c">urinary bladder in S. haematobium or me</text><rect x="54" y="650" width="1086" height="56" rx="22" fill="#0b2348"/><text x="600" y="686" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">بوابة التمريض | Bawabet Al Tamreed • IMMUNOLOGY</text></svg>